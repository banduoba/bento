[package]
name = "bento"
version = "0.3.0"
description = "Bento — a lightweight multi-pane file manager for macOS"
edition = "2021"

[lib]
name = "bento_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
trash = "*"
libc = "0.2"
fsearch = { git = "https://github.com/noahdunnagan/fsearch" }
tauri-plugin-clipboard-manager = "2"
regex = "1"
tauri-plugin-window-state = "2"
tauri-plugin-drag = "2"
tauri-plugin-dialog = "2"
bento-fswatch = { path = "fswatch" }

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSPasteboard", "NSPasteboardItem", "NSEvent", "NSResponder", "NSWindow", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSObject", "NSDictionary", "NSError", "NSFileManager", "NSAppleEventDescriptor", "objc2-core-services"] }
objc2-quick-look-ui = { version = "0.3.2", default-features = false, features = ["std", "QLPreviewItem", "QLPreviewPanel", "objc2-app-kit"] }
block2 = "0.6"

objc2-core-services = { version = "0.3", default-features = false, features = ["std", "AE", "AEDataModel", "AEMach"] }
