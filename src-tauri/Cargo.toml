[package]
name = "bento"
version = "0.1.0"
description = "Bento — 轻量多窗格文件管理器"
edition = "2021"

[lib]
name = "bento_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
trash = "*"
libc = "0.2"
fsearch = { git = "https://github.com/noahdunnagan/fsearch" }
tauri-plugin-clipboard-manager = "2"
regex = "1"
tauri-plugin-window-state = "2"
tauri-plugin-drag = "2"
tauri-plugin-dialog = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
