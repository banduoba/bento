[package]
name = "bento"
version = "0.2.0"
description = "Bento — a lightweight multi-pane file manager for macOS"
edition = "2021"

[lib]
name = "bento_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
trash = "*"
libc = "0.2"
fsearch = { git = "https://github.com/noahdunnagan/fsearch" }
tauri-plugin-clipboard-manager = "2"
regex = "1"
tauri-plugin-window-state = "2"
tauri-plugin-drag = "2"
tauri-plugin-dialog = "2"
notify = "8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
