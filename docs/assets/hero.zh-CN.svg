<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Bento — 轻量快速的 macOS 多窗格文件管理器">
  <title>Bento</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1530"/><stop offset="1" stop-color="#16326B"/></linearGradient>
    <radialGradient id="glowO" cx="0.85" cy="0.95" r="0.55"><stop offset="0" stop-color="#F0A050" stop-opacity="0.38"/><stop offset="1" stop-color="#F0A050" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.05" r="0.6"><stop offset="0" stop-color="#4A9BF7" stop-opacity="0.35"/><stop offset="1" stop-color="#4A9BF7" stop-opacity="0"/></radialGradient>
